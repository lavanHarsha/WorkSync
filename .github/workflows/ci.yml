name: CI Pipeline

on:
  pull_request:
    branches: [main, master, develop, "feature/**"]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compile / Build
        run: npm run build

      - name: Run Vitest Unit Tests
        run: npm test
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_SECRET: test-ci-pipeline-jwt-secret-key-32-chars
          JWT_REFRESH_SECRET: test-ci-pipeline-refresh-secret-key-32-chars

  frontend-checks:
    name: Frontend Build (TSC + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Vite Build
        run: npm run build
        env:
          VITE_API_URL: /api
